[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hydro-fetch"
version = "0.1.0"
description = "Retrieve and process hydrologic datasets including MRMS radar rainfall and AORC precipitation data"
authors = [
    {name = "Daniel Lassiter", email = "daniel.lassiter@outlook.com"},
]
requires-python = ">= 3.11"
readme = "README.md"
# AGPL-3.0-or-later, the ecosystem's target licence for a member's own source
# and this project's ruling of 2026-10-28. Supersedes the PolyForm Noncommercial
# 1.0.0 declaration this file carried until that date. PEP 639 form: a bare
# SPDX string, which requires setuptools>=77 and forbids a "License ::" trove
# classifier. See LICENSE for the full text.
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]

[project.optional-dependencies]
docs = [
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git", "build", "dist", "*.egg-info"]
